# Two style checks are disabled on purpose; everything else in staticcheck's
# default set is enforced.
#
# ST1005 (error strings should not be capitalized or end with punctuation):
# some errors here are written for the model and read as full sentences
# ("Summary is empty - provide a meaningful summary ..."), and others start
# with a product name ("Brave Search returned HTTP ..."). Rewording them would
# change what the model sees, for a style preference.
#
# ST1008 (error should be the last return value): one internal six-value
# function (harness streamAndExecute) returns err mid-list; reordering it would
# touch its callers for no behavioural gain.
checks = ["inherit", "-ST1005", "-ST1008"]
